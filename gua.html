:var(--sub);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:11px 13px;text-align:left}.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(36,26,22,.32)}.sheet.open{display:block}.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-top:1px solid var(--ink);border-radius:2px 2px 0 0;padding:18px 16px calc(18px+env(safe-area-inset-bottom));box-shadow:0 -18px 44px rgba(40,26,14,.16);animation:up 240ms var(--ease-out)}@keyframes up{from{transform:translateY(20px);opacity:.72}to{transform:none;opacity:1}}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet-head h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.4px}.sheet-actions{display:flex;gap:10px;margin-top:8px}.sheet-actions .primary,.sheet-actions .ghost{flex:1;text-align:center;padding:0 11px;min-height:48px}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--ink);color:#fbf7f0;font-size:13px;line-height:1.5;padding:10px 14px;border-radius:2px;max-width:min(88vw,420px);opacity:0;pointer-events:none;z-index:60;box-shadow:0 1px 0 rgba(36,26,22,.1),0 18px 44px rgba(40,26,14,.2);transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}.toast.show{opacity:1;transform:translate(-50%,0)}.debug{max-width:680px;margin:4px auto 0;padding:0 16px 20px}.debug summary{font-size:12px;color:var(--faint);cursor:pointer;list-style:none}.debug summary::-webkit-details-marker{display:none}.debug pre{margin:8px 0 0;font:11px/1.6 var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:10px;max-height:220px;overflow:auto;color:var(--sub);white-space:pre-wrap;word-break:break-all}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}@media (hover:hover) and (pointer:fine){.ghost:hover{border-col <body>

<header class="top">
  <div class="brand">
    <div class="logo">口</div>
    <div>
      <h1>预约挂号</h1>
      <p>口腔医院</p>
    </div>
  </div>
  <button class="ghost" data-act="settings">连接设置</button>
</header>

<div class="banner" id="demoBanner" hidden>
  <span class="banner-text">当前为演示数据：未检测到微信授权 openid，接口无法返回真实号源与就诊人。</span>
  <button class="link" data-act="settings">填入 openid</button>
</div>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="功能切换">
  <button class="tab" role="tab" data-act="tab" data-tab="reg" aria-pressed="true">预约挂号</button>
  <button class="tab" role="tab" data-act="tab" data-tab="monitor" aria-pressed="false">
    <span>号源监控</span><span class="tab-dot" id="tabDot" hidden></span>
  </button>
  <button class="tab" role="tab" data-act="tab" data-tab="grab" aria-pressed="false">
    <span>抢号</span><span class="tab-dot" id="grabDot" hidden></span>
  </button>
</nav>

<main class="wrap" id="main" data-view="reg">
  <section class="card" id="cardArea" data-card="area">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="area" aria-expanded="true">
        <span class="idx">1</span><span class="ctitle">选择院区</span>
        <span class="chead-note" id="noteArea"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodyArea"><div class="skeleton"></div></div>
  </section>

  <section class="card" id="cardDept" data-card="dept">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="dept" aria-expanded="true">
        <span class="idx">2</span><span class="ctitle">选择科室</span>
        <span class="chead-note" id="noteDept"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodyDept"><div class="hint">请先选择院区</div></div>
  </section>

  <section class="card" id="cardDate" data-card="date">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="date" aria-expanded="true">
        <span class="idx">3</span><span class="ctitle">就诊日期</span>
        <span class="chead-note" id="noteDate"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodyDate"><div class="hint">请先选择科室</div></div>
  </section>

  <section class="card" id="cardDoctor" data-card="doctor">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="doctor" aria-expanded="true">
        <span class="idx">4</span><span class="ctitle">选择医生</span>
        <span class="chead-note" id="noteDoctor"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodyDoctor"><div class="hint">请先选择科室与日期</div></div>
  </section>

  <section class="card" id="cardSlot" data-card="slot">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="slot" aria-expanded="true">
        <span class="idx">5</span><span class="ctitle">选择时段</span>
        <span class="chead-note" id="noteSlot"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodySlot"><div class="hint">请先选择医生</div></div>
  </section>

  <section class="card" id="cardPatient" data-card="patient">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="patient" aria-expanded="true">
        <span class="idx">6</span><span class="ctitle">就诊人</span>
        <span class="chead-note" id="notePatient"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodyPatient"><div class="skeleton"></div></div>
  </section>

  <section class="card" id="cardAgree" data-card="agree">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="agree" aria-expanded="true">
        <span class="idx">7</span><span class="ctitle">确认挂号须知</span>
        <span class="chead-note" id="noteAgree"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="bodyAgree">
      <label class="check"><input type="checkbox" id="agreeNotice"><span>我已阅读并同意《挂号须知》：实名就诊、按时段就诊、当日号源不支持线上退号。</span></label>
      <label class="check"><input type="checkbox" id="agreeShare" checked><span>允许医生调阅外院检查报告（取消勾选则表示仅阅读并同意）。</span></label>
    </div>
  </section>
</main>

<main class="wrap" id="viewMonitor" hidden>
  <section class="card" data-card="mstat">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="mstat" aria-expanded="true">
        <span class="idx">1</span><span class="ctitle">监听状态</span>
        <span class="chead-note" id="mNoteStat"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="mBodyStat"></div>
  </section>

  <section class="card" data-card="mcfg">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="mcfg" aria-expanded="true">
        <span class="idx">2</span><span class="ctitle">监控条件</span>
        <span class="chead-note" id="mNoteCfg"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="mBodyCfg"></div>
  </section>

  <section class="card" data-card="mhit">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="mhit" aria-expanded="true">
        <span class="idx">3</span><span class="ctitle">号源记录</span>
        <span class="chead-note" id="mNoteHit"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="mBodyHit"></div>
  </section>
</main>

<main class="wrap" id="viewGrab" hidden>
  <section class="card" data-card="gstat">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="gstat" aria-expanded="true">
        <span class="idx">1</span><span class="ctitle">抢号状态</span>
        <span class="chead-note" id="gNoteStat"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="gBodyStat"></div>
  </section>

  <section class="card" data-card="gcfg">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="gcfg" aria-expanded="true">
        <span class="idx">2</span><span class="ctitle">抢号条件</span>
        <span class="chead-note" id="gNoteCfg"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="gBodyCfg"></div>
  </section>

  <section class="card" data-card="gprio">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="gprio" aria-expanded="true">
        <span class="idx">3</span><span class="ctitle">优先医生</span>
        <span class="chead-note" id="gNotePrio"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="gBodyPrio"></div>
  </section>

  <section class="card" data-card="glog">
    <div class="chead">
      <button class="chead-btn" data-act="toggle" data-card="glog" aria-expanded="true">
        <span class="idx">4</span><span class="ctitle">抢号记录</span>
        <span class="chead-note" id="gNoteLog"></span><span class="chev"></span>
      </button>
    </div>
    <div class="cbody" id="gBodyLog"></div>
  </section>
</main>

<details class="debug" id="debugBox" hidden>
  <summary>接口日志</summary>
  <pre id="debugLog"></pre>
</details>

<div class="bar" id="bar">
  <div class="bar-inner">
    <div class="bar-sum">
      <div class="bar-title" id="barTitle">请选择院区</div>
      <div class="bar-sub" id="barSub">按步骤选择号源信息</div>
    </div>
    <button class="primary" id="btnConfirm" data-act="confirm" disabled>确认挂号</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h3>连接设置</h3>
      <button class="ghost" data-act="close-settings">关闭</button>
    </div>
    <div class="field"><label for="cfgApi">接口地址</label><input id="cfgApi" placeholder="留空则使用内置默认地址"></div>
    <div class="grid2">
      <div class="field"><label for="cfgAppId">AppId</label><input id="cfgAppId"></div>
      <div class="field"><label for="cfgMac">MacName</label><input id="cfgMac"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="cfgMerchant">merchantNo</label><input id="cfgMerchant"></div>
      <div class="field"><label for="cfgOpenId">openId（微信授权后获取）</label><input id="cfgOpenId" placeholder="留空则无法读取就诊人"></div>
    </div>
    <label class="check"><input type="checkbox" id="cfgDemo"><span>演示模式：不发真实请求，用内置样例数据走完整流程（未填 openid 时自动开启）</span></label>
    <div class="hint" id="cfgHint" style="margin:-2px 0 8px"></div>
    <div class="sheet-actions">
      <button class="ghost" data-act="reset-settings">恢复默认</button>
      <button class="primary" data-act="save-settings">保存并刷新数据</button>
    </div>
  </div>
</div>
